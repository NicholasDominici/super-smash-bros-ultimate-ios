name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  source:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Game-free source and publication checks
        run: |
          python3 -m pip install -r requirements.txt
          python3 tools/check.py
      - name: Bounded ARC and effect parser tests
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/smash-arc-target
        run: cargo test --locked --manifest-path tools/smash_arc/Cargo.toml
